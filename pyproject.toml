[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pklm-sandbox"
version = "0.1.0"
description = "Lightweight Hugging Face logits processing sandbox"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
]
[tool.setuptools]
packages = ["pklm_sandbox"]
